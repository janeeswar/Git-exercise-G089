<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit News</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar-custom">

    <div class="container d-flex justify-content-between align-items-center">

        <a href="/" class="brand">
            📈 ECONOTRACK
        </a>

        <div>
            <a href="/dashboard" class="nav-btn">Dashboard</a>
            <a href="/news" class="nav-btn">News</a>
            <a href="/logout" class="nav-btn">Logout</a>
        </div>

    </div>

</nav>

<section class="hero">

    <h1>
        ✏️ Edit Economic News
    </h1>

    <p>
        Update the title, content, and category of an existing economic news article.
    </p>

</section>

<div class="container mt-5">

   <div class="hub-card">

        <h2 class="fw-bold mb-4">
            Edit Economic News
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Title</label>

                <input type="text"
                       name="title"
                       value="{{ news.title }}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>

                <textarea name="content"
                          class="form-control"
                          rows="6"
                          required>{{ news.content }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>

                <input type="text"
                       name="category"
                       value="{{ news.category }}"
                       class="form-control"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                Update News
            </button>

        </form>

    </div>

</div>

<div class="footer">

    <h4>
        🌍 EconoTrack
    </h4>

    <p>
        Commodity Intelligence & Economic Impact Prediction Platform
    </p>

</div>

</body>

</html>
