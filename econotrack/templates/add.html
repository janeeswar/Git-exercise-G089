<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add News</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark p-3">
    <a href="/" class="btn btn-light btn-sm">Back to Home</a>
</nav>

<div class="container mt-5">

    <div class="card p-4 shadow-sm">

        <h2 class="fw-bold mb-4">
            Add Economic News
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" placeholder="Enter title" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea name="content" class="form-control" rows="6" placeholder="Enter content" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" placeholder="Example: Gold, Oil, Inflation" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Add News
            </button>

        </form>

    </div>

</div>

</body>

</html>
